[package]
name = "layacore"
version = "0.1.0"
edition = "2024"
authors = ["PhamBoy47 <raveendraravuri7@outlook.com>"]
description = "LayaCore — Pure Rust offline audio mastering, loudness (ITU-R BS.1770 / EBU R128), fake lossless transcode verification, MIR, and batch album scanning suite."
license = "MIT"
repository = "https://github.com/PhamBoy47/LayaCore"
readme = "README.md"
keywords = ["audio", "lufs", "mastering", "flac", "dsp"]
categories = ["multimedia::audio", "command-line-utilities"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
symphonia = { version = "0.5", features = ["all"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
colored = "2.1"
comfy-table = "7.1"
realfft = "3.3"
rustfft = "6.2"
plotters = "0.3"
termichart-charts = "0.1.0"
termichart-core = "0.1.0"
termichart-render = "0.1.0"
console = "0.15"
