  <!-- Card 3: Advisor & Test Verification -->
  <rect x="604" y="356" width="272" height="138" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.4"/>
  <text x="620" y="376" class="f layer" fill="#8250df">Intelligence &amp; QA Verification</text>
  <line x1="618" y1="384" x2="862" y2="384" stroke="#d0d7de" stroke-width="1"/>
  <text x="620" y="404" class="mono mod-purple">src/advisor.rs</text>
  <text x="620" y="420" class="f sub">0–100 Readiness Score, Grades &amp; Fixes</text>
  <text x="620" y="434" class="f sub">(Headroom, LUFS, Phase, EQ, Authenticity)</text>
  <line x1="618" y1="445" x2="862" y2="445" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="620" y="463" class="mono mod-green">tests/*.rs  (7 Suites • 18 Tests)</text>
  <text x="620" y="479" class="f sub">Opus, LUFS, Spectral, Batch, Advisor, Charts</text>

  <!-- Arrows Layer 4 (y=494) -> Layer 5 (top edge y=524 -> line ends y=517) -->
  <line x1="160" y1="494" x2="160" y2="517" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>
  <line x1="450" y1="494" x2="450" y2="517" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>
  <line x1="740" y1="494" x2="740" y2="517" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>

  <!-- ==================== LAYER 5: REPORT & EXPORT LAYER (y=524..614) ==================== -->
  <rect x="24" y="524" width="852" height="90" rx="12" fill="#eefbf1" fill-opacity="0.72" stroke="#1a7f37" stroke-width="1.4"/>
  <text x="42" y="542" class="f layer" fill="#1a7f37">Presentation &amp; Export Layer  —  src/report/</text>

  <rect x="38" y="552" width="194" height="50" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="135" y="570" text-anchor="middle" class="mono mod-green">report/terminal.rs</text>
  <text x="135" y="588" text-anchor="middle" class="f sub">Colored comfy-table Reports</text>

  <rect x="248" y="552" width="194" height="50" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="345" y="570" text-anchor="middle" class="mono mod-green">report/term_charts.rs</text>
  <text x="345" y="588" text-anchor="middle" class="f sub">TermiChart FFT, Chroma, Wave</text>

  <rect x="458" y="552" width="194" height="50" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="555" y="570" text-anchor="middle" class="mono mod-green">report/charts.rs</text>
  <text x="555" y="588" text-anchor="middle" class="f sub">Plotters PNG / SVG Dashboard</text>

  <rect x="668" y="552" width="194" height="50" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="765" y="570" text-anchor="middle" class="mono mod-green">report/json.rs</text>
