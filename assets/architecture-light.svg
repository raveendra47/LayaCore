<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" role="img" aria-label="LayaCore Software Architecture and Module Map">
  <defs>
    <linearGradient id="entryGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="coreGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <marker id="arrL" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="2.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 4.5 L 0 8 L 1.5 4.5 z" fill="#57606a"/>
    </marker>
    <marker id="arrRedL" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="2.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 4.5 L 0 8 L 1.5 4.5 z" fill="#cf222e"/>
    </marker>
    <marker id="arrBlueL" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="2.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 4.5 L 0 8 L 1.5 4.5 z" fill="#0969da"/>
    </marker>
    <marker id="arrAmberL" markerUnits="userSpaceOnUse" viewBox="0 0 9 9" refX="2.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 1 L 9 4.5 L 0 8 L 1.5 4.5 z" fill="#9a6700"/>
    </marker>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .h1 { font-size: 13px; font-weight: 700; fill: #1f2328; }
      .h2 { font-size: 11.5px; font-weight: 700; fill: #1f2328; }
      .sub { font-size: 10.5px; font-weight: 400; fill: #57606a; }
      .mod { font-size: 10.5px; font-weight: 600; fill: #0969da; }
      .mod-red { font-size: 10.5px; font-weight: 600; fill: #cf222e; }
      .mod-amber { font-size: 10.5px; font-weight: 600; fill: #9a6700; }
      .mod-green { font-size: 10.5px; font-weight: 600; fill: #1a7f37; }
      .mod-purple { font-size: 10.5px; font-weight: 600; fill: #8250df; }
      .layer { font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; fill: #424a53; }
    </style>
  </defs>

  <!-- ==================== LAYER 1: ENTRY & BUILD (y=14..92) ==================== -->
  <rect x="24" y="14" width="256" height="78" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="40" y="34" class="mono mod-amber">build.rs</text>
  <text x="40" y="52" class="f h2">Windows Icon Compiler</text>
  <text x="40" y="69" class="f sub">Pure-Rust .ico → .res linker</text>
  <text x="40" y="83" class="f sub">Embeds layacore.ico into .exe</text>

  <!-- Compile-time arrow build.rs (x=280) -> main.rs (x=312 -> line ends x=305) -->
  <line x1="280" y1="53" x2="305" y2="53" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrAmberL)"/>

  <rect x="312" y="14" width="276" height="78" rx="10" fill="url(#entryGradL)" stroke="#cf222e" stroke-width="1.6"/>
  <text x="450" y="34" text-anchor="middle" class="mono mod-red">src/main.rs  →  layacore_cli.exe</text>
  <text x="450" y="53" text-anchor="middle" class="f h1">CLI Entry &amp; Command Router</text>
  <text x="450" y="70" text-anchor="middle" class="f sub">clap Flags • Progress Bars • Auto Dir Detection</text>
  <text x="450" y="84" text-anchor="middle" class="f sub">Single Track • Batch Scan • JSON / CSV / Plot</text>

  <!-- Arrow main.rs (x=588) -> menu.rs (x=620 -> line ends x=613) -->
  <line x1="588" y1="53" x2="613" y2="53" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrRedL)"/>

  <rect x="620" y="14" width="256" height="78" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.3"/>
  <text x="636" y="34" class="mono mod-red">src/menu.rs</text>
  <text x="636" y="52" class="f h2">Interactive TUI Launcher</text>
  <text x="636" y="69" class="f sub">Arrow-key Menu [1–6] &amp; ANSI Banner</text>
  <text x="636" y="83" class="f sub">Windows Drag-and-Drop Path Guard</text>

  <!-- Arrows Layer 1 (y=92) -> Layer 2 (top edge y=124 -> line ends y=117) -->
  <line x1="410" y1="92" x2="410" y2="117" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arrRedL)"/>
  <path d="M 510 92 L 510 102 Q 510 107 515 107 L 612 107" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <path d="M 748 92 L 748 102 Q 748 107 743 107 L 612 107" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <line x1="612" y1="107" x2="612" y2="117" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrL)"/>

  <!-- ==================== LAYER 2: ORCHESTRATION & PUBLIC API (y=124..200) ==================== -->
  <rect x="24" y="124" width="446" height="76" rx="10" fill="url(#coreGradL)" stroke="#0969da" stroke-width="1.6"/>
  <text x="247" y="144" text-anchor="middle" class="mono mod">src/lib.rs  (Public Library Crate: layacore)</text>
  <text x="247" y="163" text-anchor="middle" class="f h1">Single-Pass Streaming Analysis Pipeline</text>
  <text x="247" y="180" text-anchor="middle" class="f sub">analyze_file() feeds decoded f32 PCM chunks concurrently to all</text>
  <text x="247" y="193" text-anchor="middle" class="f sub">meters, FFT/MIR engines, transcode detector &amp; advisor in one pass</text>

  <rect x="488" y="124" width="248" height="76" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
  <text x="612" y="144" text-anchor="middle" class="mono mod">src/batch.rs</text>
  <text x="612" y="163" text-anchor="middle" class="f h2">Parallel Batch / Album Scanner</text>
  <text x="612" y="180" text-anchor="middle" class="f sub">Multi-core Worker Pool • Recursive Discovery</text>
  <text x="612" y="193" text-anchor="middle" class="f sub">Album LUFS Spread, Outliers &amp; FLAC Audit</text>

  <!-- batch.rs (x=488) -> lib.rs (x=470 -> line ends x=477) -->
  <line x1="488" y1="162" x2="477" y2="162" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrBlueL)"/>

  <!-- Shared error link batch.rs (x=736) to error.rs (x=752) -->
  <line x1="736" y1="162" x2="752" y2="162" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="3 2"/>

  <rect x="752" y="124" width="124" height="76" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <text x="814" y="146" text-anchor="middle" class="mono mod-purple">src/error.rs</text>
  <text x="814" y="165" text-anchor="middle" class="f h2">Typed Errors</text>
  <text x="814" y="181" text-anchor="middle" class="f sub">AnalyzerError</text>
  <text x="814" y="193" text-anchor="middle" class="f sub">Format Guards</text>

  <!-- Arrow Layer 2 (y=200) -> Layer 3 (top edge y=232 -> line ends y=225) -->
  <line x1="247" y1="200" x2="247" y2="225" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrBlueL)"/>

  <!-- ==================== LAYER 3: DECODING LAYER (y=232..326) ==================== -->
  <rect x="24" y="232" width="852" height="94" rx="12" fill="#f6f8fa" fill-opacity="0.92" stroke="#d0d7de" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="42" y="250" class="f layer">Decoding Layer  —  src/decoder/  (Pure Rust • Zero C/FFI • Interleaved f32 PCM)</text>

  <rect x="38" y="260" width="194" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="135" y="278" text-anchor="middle" class="mono mod">decoder/mod.rs</text>
  <text x="135" y="294" text-anchor="middle" class="f sub">AudioDecoder Trait &amp; Router</text>
  <text x="135" y="307" text-anchor="middle" class="f sub">Unsupported Format Diagnostics</text>

  <rect x="248" y="260" width="194" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="345" y="278" text-anchor="middle" class="mono mod">decoder/symphonia.rs</text>
  <text x="345" y="294" text-anchor="middle" class="f sub">FLAC, WAV, MP3, AAC, ALAC</text>
  <text x="345" y="307" text-anchor="middle" class="f sub">OGG Vorbis, AIFF, CAF Demuxer</text>

  <rect x="458" y="260" width="194" height="54" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.4"/>
  <text x="555" y="278" text-anchor="middle" class="mono mod-red">decoder/opus.rs</text>
  <text x="555" y="294" text-anchor="middle" class="f sub">rusty-opus (RFC 6716 / 7845)</text>
  <text x="555" y="307" text-anchor="middle" class="f sub">Mono/Stereo, pre_skip, Q7.8 Gain</text>

  <rect x="668" y="260" width="194" height="54" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.3"/>
  <text x="765" y="278" text-anchor="middle" class="mono mod">decoder/au.rs</text>
  <text x="765" y="294" text-anchor="middle" class="f sub">Custom Sun AU / SND Parser</text>
  <text x="765" y="307" text-anchor="middle" class="f sub">Linear PCM &amp; 8-bit μ-law</text>

  <!-- Orthogonal 3-Way Distribution Bus Layer 3 (y=326) -> Layer 4 (top edge y=356 -> line ends y=349) -->
  <line x1="450" y1="326" x2="450" y2="349" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>
  <path d="M 450 338 L 166 338 Q 160 338 160 344 L 160 349" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>
  <path d="M 450 338 L 734 338 Q 740 338 740 344 L 740 349" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrL)"/>

