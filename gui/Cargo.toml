[package]
name = "layacore-gui"
version = "0.1.0"
edition = "2024"
authors = ["PhamBoy47 <raveendraravuri7@outlook.com>"]
description = "LayaCore Desktop — Pure-Rust GPU-accelerated (wgpu DirectX 12 / Vulkan with CPU fallback) audio mastering, loudness, lossless verification & batch album scanning application."
license = "MIT"
repository = "https://github.com/PhamBoy47/LayaCore"

[[bin]]
name = "layacore"
path = "src/main.rs"

[dependencies]
layacore = { path = ".." }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "tokio", "image"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
